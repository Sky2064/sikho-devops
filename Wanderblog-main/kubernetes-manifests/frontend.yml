apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 10
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:	
            - labelSelector:	
                matchLabels:	
                  app: frontend	
              topologyKey: topology.kubernetes.io/zone
      containers:
        - name: frontend
          # Updated to use your ACR. Replace tag if needed.
          image: acrgsky.azurecr.io/wanderblog-frontend:v1
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend-config
      # If your ACR requires imagePullSecrets, create a secret:
      # kubectl create secret docker-registry acr-secret --docker-server=acrgsky.azurecr.io --docker-username=<USERNAME> --docker-password=<PASSWORD> --docker-email=<EMAIL>
      # then add `imagePullSecrets:
      # - name: acr-secret` under `spec:`
